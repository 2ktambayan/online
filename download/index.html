<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>2K Tambayan Online Order - Download</title>
  <meta name="theme-color" content="#111111">
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      font-family:Arial,sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(255,10,138,.10), transparent 28%),
        radial-gradient(circle at 85% 80%, rgba(255,10,138,.08), transparent 28%),
        #f7f7f9;
      color:#161616;
    }
    .card{
      width:min(100%,420px);
      background:#fff;
      border-radius:22px;
      padding:28px 24px;
      text-align:center;
      box-shadow:0 16px 40px rgba(0,0,0,.12);
      border:1px solid #eee;
    }
    .logo{
      width:88px;height:88px;
      margin:0 auto 14px;
      border-radius:50%;
      object-fit:contain;
      background:#111;
    }
    h1{margin:0;font-size:24px}
    .sub{margin:7px 0 20px;color:#666;font-size:13px;line-height:1.45}
    .spinner{
      width:42px;height:42px;
      border:4px solid #eee;
      border-top-color:#ff0a8a;
      border-radius:50%;
      margin:18px auto;
      animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .status{font-size:13px;font-weight:700;color:#444}
    .btn{
      display:none;
      margin-top:18px;
      width:100%;
      border:0;
      border-radius:13px;
      padding:14px 16px;
      background:#ff0a8a;
      color:#fff;
      text-decoration:none;
      font-weight:900;
      font-size:15px;
    }
    .note{margin-top:16px;font-size:11px;color:#777;line-height:1.45}
    .btn.browser{
      display:inline-block;
      margin-top:10px;
      background:#111;
      color:#fff;
    }
    .choice-note{
      margin-top:13px;
      font-size:12px;
      color:#555;
      line-height:1.45;
      font-weight:700;
    }
    .or{
      margin:13px 0 2px;
      font-size:11px;
      color:#999;
      font-weight:800;
      letter-spacing:.6px;
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="../logo.png" alt="2K Tambayan" class="logo" onerror="this.style.display='none'">
    <h1>2K Tambayan Online Order</h1>
    <div class="sub">Choose how you want to order.</div>
    <div class="spinner" id="spinner"></div>
    <div class="status" id="status">Checking the latest Android app...</div>

    <a
      class="btn"
      id="downloadBtn"
      href="https://github.com/2ktambayan/online/releases/download/v1.0.0/app-release.apk"
    >
      DOWNLOAD ANDROID APP
    </a>

    <div class="or">OR</div>

    <a
      class="btn browser"
      id="browserOrderBtn"
      href="https://2ktambayan.github.io/online/"
    >
      ORDER IN BROWSER
    </a>

    <div class="choice-note">
      No installation needed for browser ordering.
    </div>

    <div class="note">
      Android may ask permission to install apps from your browser the first time.
    </div>
  </main>

<script>
(async function() {
  const status = document.getElementById('status');
  const spinner = document.getElementById('spinner');
  const btn = document.getElementById('downloadBtn');

  const fallback = "https://github.com/2ktambayan/online/releases/download/v1.0.0/app-release.apk";

  try {
    const res = await fetch(
      'https://api.github.com/repos/2ktambayan/online/releases/latest',
      { headers: { 'Accept':'application/vnd.github+json' } }
    );

    if (!res.ok) throw new Error('Latest release unavailable');

    const release = await res.json();
    const assets = Array.isArray(release.assets) ? release.assets : [];
    const apk = assets.find(a =>
      typeof a.name === 'string' &&
      a.name.toLowerCase().endsWith('.apk')
    );

    if (!apk || !apk.browser_download_url) {
      throw new Error('APK asset not found');
    }

    status.textContent = 'Latest Android app is ready.';
    spinner.style.display = 'none';
    btn.style.display = 'inline-block';
    btn.href = apk.browser_download_url;

  } catch (e) {
    status.textContent = 'You can download the app or continue in your browser.';
    spinner.style.display = 'none';
    btn.style.display = 'inline-block';
    btn.href = fallback;
  }
})();
</script>
</body>
</html>
